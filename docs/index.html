<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leaving together | Bye Bye Meta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif&amp;family=Space+Grotesk:wght@400;700&amp;display=swap">
  <link rel="stylesheet" href="leaving-together.css">
  <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.min.js" defer></script>
  <script src="leaving-together.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a href="./">Bye Bye Meta</a>
      <h1>Would you<br>leave Meta?</h1>
      <p>If a reliable local alternative existed and other Brussels institutions moved there too, would you leave Facebook and Instagram?</p>
    </header>
    <div id="field" aria-hidden="true"></div>
    <div class="channels">
      <div class="channel-controls" role="group" aria-labelledby="channel-heading">
        <span id="channel-heading">Channels already in use</span>
        <span id="channel-buttons"></span>
      </div>
      <p id="channel-status" aria-live="polite"></p>
    </div>
    <div class="action">
      <button id="hold" type="button" aria-pressed="false" aria-describedby="instructions" disabled>Make space elsewhere</button>
      <span id="instructions">Press and hold to open the field and reveal another response.</span>
    </div>
    <footer>
      <div class="responses">
        <p>One mark per survey response</p>
        <ul id="response-key"></ul>
      </div>
      <figure>
        <figcaption>What would you lose or gain if Facebook and Instagram disappeared?</figcaption>
        <div class="quote-controls" role="group" aria-label="Browse survey responses">
          <button id="previous-quote" type="button">Previous</button>
          <button id="next-quote" type="button">Next</button>
        </div>
        <div aria-live="polite" aria-atomic="true">
          <p id="quote-position" class="quote-position"></p>
          <blockquote id="quote"></blockquote>
        </div>
      </figure>
    </footer>
    <noscript>This visualization requires JavaScript. <a href="./leaving-meta.html">Read the survey results.</a></noscript>
  </main>
</body>
</html>
